<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA — Request Status</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ==========================================
           TOP BAR
           ========================================== */

        .topbar {

            width: 100%;
            height: 70px;

            padding: 0 45px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #050505;

            border-bottom: 1px solid #222222;
        }

        .logo {

            color: #ffffff;

            font-size: 20px;
            font-weight: 900;

            letter-spacing: 5px;
        }


        /* ==========================================
           MAIN PAGE
           ========================================== */

        .page {

            width: 90%;
            max-width: 900px;

            margin: 70px auto 100px;
        }


        .eyebrow {

            margin: 0 0 18px;

            color: #777777;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 4px;
        }


        h1 {

            margin: 0;

            color: #ffffff;

            font-size: clamp(45px, 7vw, 80px);

            line-height: 0.95;

            font-weight: 900;

            letter-spacing: -4px;
        }


        /* ==========================================
           STATUS CARD
           ========================================== */

        .status-card {

            margin-top: 45px;

            padding: 40px;

            background: #101010;

            border: 1px solid #292929;

            border-radius: 12px;
        }


        /* ==========================================
           STATUS ICON
           ========================================== */

        .status-icon {

            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 25px;

            border: 1px solid #d4af37;

            border-radius: 50%;

            color: #d4af37;

            font-size: 25px;
            font-weight: bold;
        }


        /* ==========================================
           STATUS LABEL
           ========================================== */

        #status {

            display: inline-block;

            padding: 10px 16px;

            background: transparent;

            border: 1px solid #d4af37;

            color: #d4af37;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        /* ==========================================
           MESSAGE
           ========================================== */

        #message {

            margin-top: 25px;

            color: #aaaaaa;

            font-size: 14px;

            line-height: 1.7;
        }


        /* ==========================================
           BOOKING DETAILS
           ========================================== */

        .details {

            margin-top: 35px;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 1px;

            background: #292929;

            border: 1px solid #292929;
        }


        .detail {

            padding: 20px;

            background: #0b0b0b;
        }


        .detail-label {

            display: block;

            margin-bottom: 8px;

            color: #666666;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        .detail-value {

            color: #ffffff;

            font-size: 14px;

            word-break: break-word;
        }


        /* ==========================================
           NOTICE
           ========================================== */

        .notice {

            margin-top: 25px;

            padding: 20px;

            background: #0b0b0b;

            border-left: 2px solid #d4af37;

            color: #999999;

            font-size: 13px;

            line-height: 1.7;
        }


        .notice strong {

            color: #ffffff;
        }


        /* ==========================================
           BUTTONS
           ========================================== */

        .buttons {

            margin-top: 30px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }


        button {

            height: 48px;

            padding: 0 24px;

            background: transparent;

            color: #ffffff;

            border: 1px solid #555555;

            border-radius: 4px;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;
        }


        button:hover {

            background: #ffffff;

            color: #000000;

            border-color: #ffffff;
        }


        /* ==========================================
           PAYMENT BUTTON
           ========================================== */

        #pay-btn {

            display: none;

            background: #d4af37;

            color: #000000;

            border-color: #d4af37;
        }


        #pay-btn:hover {

            background: #ffffff;

            color: #000000;

            border-color: #ffffff;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 600px) {

            .topbar {

                height: 68px;

                padding: 0 20px;
            }


            .page {

                width: 92%;

                margin: 45px auto 70px;
            }


            h1 {

                font-size: 50px;

                letter-spacing: -2px;
            }


            .status-card {

                padding: 25px;
            }


            .details {

                grid-template-columns: 1fr;
            }


            .buttons {

                flex-direction: column;
            }


            button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================
         TOP BAR
         ========================================== -->

    <header class="topbar">

        <div class="logo">
            VELORA
        </div>

    </header>



    <!-- ==========================================
         MAIN
         ========================================== -->

    <main class="page">


        <p class="eyebrow">
            BOOKING REQUEST
        </p>


        <h1 id="page-title">
            REQUEST SENT
        </h1>



        <section class="status-card">


            <!-- STATUS ICON -->

            <div
                id="status-icon"
                class="status-icon"
            >
                ✓
            </div>



            <!-- STATUS -->

            <div id="status">
                PENDING OWNER APPROVAL
            </div>



            <!-- MESSAGE -->

            <p id="message">

                Your car rental request has been
                successfully submitted to the
                Velora owner.

            </p>



            <!-- ==================================
                 BOOKING DETAILS
                 ================================== -->

            <div class="details">


                <div class="detail">

                    <span class="detail-label">
                        BOOKING ID
                    </span>

                    <span
                        class="detail-value"
                        id="booking-id"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        CUSTOMER
                    </span>

                    <span
                        class="detail-value"
                        id="customer"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        CAR
                    </span>

                    <span
                        class="detail-value"
                        id="car"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        DATES
                    </span>

                    <span
                        class="detail-value"
                        id="dates"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        PICKUP
                    </span>

                    <span
                        class="detail-value"
                        id="pickup"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        DROP
                    </span>

                    <span
                        class="detail-value"
                        id="drop"
                    >
                        -
                    </span>

                </div>



                <div class="detail">

                    <span class="detail-label">
                        TOTAL
                    </span>

                    <span
                        class="detail-value"
                        id="total"
                    >
                        -
                    </span>

                </div>


            </div>



            <!-- ==================================
                 NOTICE
                 ================================== -->

            <div
                id="notice"
                class="notice"
            >

                <strong>
                    What happens next?
                </strong>

                <br>

                The Velora owner will review
                your booking request.

            </div>



            <!-- ==================================
                 BUTTONS
                 ================================== -->

            <div class="buttons">


                <button id="refresh-btn">

                    CHECK STATUS

                </button>



                <button id="pay-btn">

                    PAY NOW

                </button>



                <button id="home-btn">

                    BACK TO HOME

                </button>


            </div>


        </section>


    </main>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script>


        /* ==========================================
           GET CURRENT BOOKING
           ========================================== */

        function getCurrentBooking() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "veloraBooking"
                    )
                ) || null;

            } catch (error) {

                return null;
            }

        }



        /* ==========================================
           GET LATEST OWNER REQUEST
           ========================================== */

        function getLatestRequest(bookingId) {

            try {

                const requests =
                    JSON.parse(
                        localStorage.getItem(
                            "veloraBookingRequests"
                        )
                    ) || [];


                return requests.find(
                    function (request) {

                        return request &&
                            String(
                                request.bookingId
                            ) === String(
                                bookingId
                            );

                    }
                ) || null;


            } catch (error) {

                return null;
            }
        }



        /* ==========================================
           UPDATE STATUS
           ========================================== */

        function updateStatus(status) {


            status =
                String(
                    status || "PENDING"
                ).toUpperCase();



            const statusElement =
                document.getElementById(
                    "status"
                );


            const titleElement =
                document.getElementById(
                    "page-title"
                );


            const messageElement =
                document.getElementById(
                    "message"
                );


            const noticeElement =
                document.getElementById(
                    "notice"
                );


            const iconElement =
                document.getElementById(
                    "status-icon"
                );


            const payButton =
                document.getElementById(
                    "pay-btn"
                );



            /* Hide payment initially */

            payButton.style.display =
                "none";



            /* ======================================
               PENDING
               ====================================== */

            if (status === "PENDING") {


                titleElement.textContent =
                    "REQUEST SENT";


                statusElement.textContent =
                    "PENDING OWNER APPROVAL";


                statusElement.style.background =
                    "transparent";


                statusElement.style.borderColor =
                    "#d4af37";


                statusElement.style.color =
                    "#d4af37";


                messageElement.textContent =
                    "Your car rental request has been successfully submitted to the Velora owner.";


                noticeElement.innerHTML =
                    "<strong>What happens next?</strong><br>" +
                    "The Velora owner will review your request. " +
                    "Payment will become available only after the owner approves your booking.";


                iconElement.textContent =
                    "✓";


                return;
            }



            /* ======================================
               APPROVED
               ====================================== */

            if (status === "APPROVED") {


                titleElement.textContent =
                    "BOOKING APPROVED";


                statusElement.textContent =
                    "APPROVED — PAYMENT REQUIRED";


                statusElement.style.background =
                    "#d4af37";


                statusElement.style.borderColor =
                    "#d4af37";


                statusElement.style.color =
                    "#000000";


                messageElement.textContent =
                    "Great news! The Velora owner has approved your booking.";


                noticeElement.innerHTML =
                    "<strong>Next step: Payment</strong><br>" +
                    "Your car has been approved for the selected dates. " +
                    "Complete the payment to confirm your booking.";


                iconElement.textContent =
                    "✓";


                payButton.style.display =
                    "inline-block";


                return;
            }



            /* ======================================
               REJECTED
               ====================================== */

            if (status === "REJECTED") {


                titleElement.textContent =
                    "REQUEST REJECTED";


                statusElement.textContent =
                    "BOOKING REJECTED";


                statusElement.style.background =
                    "transparent";


                statusElement.style.borderColor =
                    "#777777";


                statusElement.style.color =
                    "#aaaaaa";


                messageElement.textContent =
                    "Unfortunately, the Velora owner has rejected this booking request.";


                noticeElement.innerHTML =
                    "<strong>Booking not confirmed</strong><br>" +
                    "No payment is required for this rejected request. " +
                    "You can return home and choose another car or dates.";


                iconElement.textContent =
                    "×";


                return;
            }



            /* ======================================
               PAID / CONFIRMED
               ====================================== */

            if (
                status === "PAID" ||
                status === "CONFIRMED"
            ) {


                titleElement.textContent =
                    "BOOKING CONFIRMED";


                statusElement.textContent =
                    "PAYMENT SUCCESSFUL";


                statusElement.style.background =
                    "#d4af37";


                statusElement.style.borderColor =
                    "#d4af37";


                statusElement.style.color =
                    "#000000";


                messageElement.textContent =
                    "Your Velora booking has been successfully confirmed.";


                noticeElement.innerHTML =
                    "<strong>Booking confirmed</strong><br>" +
                    "Your payment has been received and your car is reserved.";


                iconElement.textContent =
                    "✓";


                return;
            }

        }



        /* ==========================================
           DISPLAY BOOKING
           ========================================== */

        function displayBooking() {


            const booking =
                getCurrentBooking();



            if (!booking) {


                document
                    .getElementById(
                        "page-title"
                    )
                    .textContent =
                    "NO BOOKING FOUND";


                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                    "No booking information was found.";


                return;
            }



            /* Get latest owner status */

            const latestRequest =
                getLatestRequest(
                    booking.bookingId
                );



            if (latestRequest) {


                booking.status =
                    latestRequest.status ||
                    booking.status ||
                    "PENDING";


                localStorage.setItem(
                    "veloraBooking",
                    JSON.stringify(
                        booking
                    )
                );

            }



            /* Booking ID */

            document
                .getElementById(
                    "booking-id"
                )
                .textContent =
                booking.bookingId || "-";



            /* Customer */

            document
                .getElementById(
                    "customer"
                )
                .textContent =
                booking.customerName || "-";



            /* Car */

            document
                .getElementById(
                    "car"
                )
                .textContent =
                booking.carName || "-";



            /* Dates */

            if (
                booking.fromDate &&
                booking.toDate
            ) {


                document
                    .getElementById(
                        "dates"
                    )
                    .textContent =
                    booking.fromDate +
                    " → " +
                    booking.toDate;


            } else {


                document
                    .getElementById(
                        "dates"
                    )
                    .textContent =
                    "-";

            }



            /* Pickup */

            document
                .getElementById(
                    "pickup"
                )
                .textContent =
                booking.pickup || "-";



            /* Drop */

            document
                .getElementById(
                    "drop"
                )
                .textContent =
                booking.drop || "-";



            /* Total */

            const total =
                Number(
                    booking.total || 0
                );


            document
                .getElementById(
                    "total"
                )
                .textContent =
                total > 0
                    ? "₹" +
                      total.toLocaleString(
                          "en-IN"
                      )
                    : "-";



            /* Update status */

            updateStatus(
                booking.status ||
                "PENDING"
            );

        }



        /* ==========================================
           INITIAL LOAD
           ========================================== */

        displayBooking();



        /* ==========================================
           CHECK STATUS
           ========================================== */

        document
            .getElementById(
                "refresh-btn"
            )
            .addEventListener(
                "click",
                function () {

                    displayBooking();

                }
            );



        /* ==========================================
           PAYMENT
           ========================================== */

        document
            .getElementById(
                "pay-btn"
            )
            .addEventListener(
                "click",
                function () {

                    const booking =
                        getCurrentBooking();


                    if (
                        !booking ||
                        String(
                            booking.status
                        ).toUpperCase() !==
                        "APPROVED"
                    ) {

                        alert(
                            "Payment is available only after the owner approves your booking."
                        );

                        return;
                    }


                    window.location.href =
                        "/payment.html";

                }
            );



        /* ==========================================
           HOME
           ========================================== */

        document
            .getElementById(
                "home-btn"
            )
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "/";

                }
            );


    </script>

</body>

</html>
