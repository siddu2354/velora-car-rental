<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA — Booking Details</title>

    <link rel="stylesheet" href="/src/personal-details.css">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <div class="logo">
            VELORA
        </div>

        <div class="topbar-right">

            <span id="customer-name">
                Hello, Customer
            </span>

            <button id="logout-btn">
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="details-page">

        <!-- LEFT SIDE -->

        <section class="customer-section">

            <p class="eyebrow">
                CUSTOMER DETAILS
            </p>

            <h1 id="customer-title">
                Customer
            </h1>

            <p class="description">
                Provide the required details to continue with your VELORA booking.
            </p>


            <!-- SELECTED VEHICLE -->

            <div class="selected-vehicle">

                <p class="vehicle-label">
                    SELECTED VEHICLE
                </p>

                <h2 id="car-name">
                    Toyota Fortuner
                </h2>

                <p id="car-price">
                    ₹4,500 / day
                </p>

            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="form-card">

            <p class="form-eyebrow">
                BOOKING INFORMATION
            </p>

            <h2>
                Your details.
            </h2>

            <p class="form-description">
                Enter the required information before sending your booking request.
            </p>


            <!-- FORM -->

            <form id="personal-details-form">

                <!-- DRIVING LICENCE -->

                <div class="form-group">

                    <label for="license">
                        DRIVING LICENCE NUMBER
                    </label>

                    <input
                        type="text"
                        id="license"
                        placeholder="Enter driving licence number"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PAN -->

                <div class="form-group">

                    <label for="pan">
                        PAN CARD NUMBER
                    </label>

                    <input
                        type="text"
                        id="pan"
                        placeholder="Enter PAN card number"
                        maxlength="10"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PICKUP -->

                <div class="form-group">

                    <label for="pickup">
                        PICKUP POINT
                    </label>

                    <input
                        type="text"
                        id="pickup"
                        placeholder="Enter pickup location"
                        required
                    >

                </div>


                <!-- DROP -->

                <div class="form-group">

                    <label for="drop">
                        DROP POINT
                    </label>

                    <input
                        type="text"
                        id="drop"
                        placeholder="Enter drop location"
                        required
                    >

                </div>


                <!-- CONTINUE -->

                <button
                    type="submit"
                    class="continue-button"
                >
                    CONTINUE TO BOOKING
                </button>

            </form>


            <!-- BACK -->

            <button
                type="button"
                id="back-btn"
                class="back-button"
            >
                ← BACK TO BOOKING
            </button>

        </section>

    </main>


    <script src="/src/personal-details.js"></script>

</body>

</html>
