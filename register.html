<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA — Register</title>

    <link rel="stylesheet" href="/src/register.css">
</head>

<body>

    <main class="register-page">

        <div class="register-logo">
            VELORA
        </div>

        <section class="register-card">

            <p class="eyebrow">
                START YOUR JOURNEY
            </p>

            <h1>
                Register<br>
                Now.
            </h1>

            <p class="description">
                Create your customer profile to continue with your
                VELORA car rental.
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="name">CUSTOMER NAME</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">PHONE NUMBER</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >
                </div>

                <button type="submit">
                    CONTINUE
                </button>

            </form>

        </section>

    </main>

    <script type="module" src="/src/register.js"></script>

</body>

</html>
